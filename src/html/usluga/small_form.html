<section class="container form">
	<h2 class="title d-none d-md-block">Оставить запрос на подключение</h2>
	<div class="form-wrapper grid">
		<div class="form__block d-none d-md-block image"></div>
		<form action="#" class="form__block d-flex flex-column">
			<p class="d-sm-block d-md-none block-address__mobile">Оставить запрос на подключение</p>
			<p class="form-title d-none d-sm-none d-md-block">Оставьте заявку — мы подберём подходящий тариф и договоримся о подключении</p>
			<input type="text" class="form__input default-input" placeholder="Как вас зовут?" />
			<input type="tel" id="phone" class="form__input tel default-input" placeholder="+7 - 999 - 999 - 99 - 99" />
			<label class="form__checkbox grid">
				<div class="d-inline position-relative form-input-wrapper d-flex align-items-center">
					<input type="checkbox" />
					<svg width="22" height="15" class="checkbox-icon">
						<use xlink:href="../../../images/sprite.svg#tick"></use>
					</svg>
				</div>
				<p class="form__description">
					Да, я соглашаюсь <br />
					с&nbsp;<a href="#" class="link-strong">условиями обработки персональных данных</a>
				</p>
			</label>
			<button class="form__btn t-btn" type="submit">Оставить заявку</button>
		</form>
	</div>
</section>
