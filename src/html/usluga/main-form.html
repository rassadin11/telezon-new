<section class="container form main-form">
	<h2 class="title d-none d-md-block">Заинтересовало предложение? Оставьте заявку!</h2>
	<div class="form-wrapper d-grid">
		<form action="#" class="form__block d-flex flex-column no-border">
			<p class="d-sm-block d-md-none block-address__mobile">Заинтересовало предложение?</p>
			<input type="text" class="form__input default-input mt-0" placeholder="Как вас зовут?" />
			<input type="mail" id="email" class="form__input tel default-input" placeholder="Ваш email" />
			<input type="tel" id="phone" class="form__input tel default-input" placeholder="+7 - 999 - 999 - 99 - 99" />
			<textarea rows="7" name="form__textarea" class="form__textarea" id="form-textarea" placeholder="Комментарий"></textarea>
			<label class="form__checkbox d-grid">
				<div class="d-inline position-relative form-input-wrapper d-flex align-items-center">
					<input type="checkbox" />
					<svg width="22" height="15" class="checkbox-icon">
						<use xlink:href="../../../images/sprite.svg#tick"></use>
					</svg>
				</div>
				<p class="form__description">
					Да, я соглашаюсь <br />
					с&nbsp;<a href="#" class="link-strong">условиями обработки персональных данных</a>
				</p>
			</label>
			<button class="form__btn t-btn" type="submit">Оставить заявку</button>
		</form>
		<div class="form__block d-none d-md-block image"></div>
	</div>
</section>
